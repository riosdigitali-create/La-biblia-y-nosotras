<!DOCTYPE html>

<head>

<!--
  Esta ruta existió unos días como maqueta paralela de /registrar/.
  Tener dos formularios de líder era un error: uno guardaba de verdad
  en `group_applications` y pasaba por revisión del equipo, y el otro
  no guardaba nada.

  Se conserva el que funciona. Este archivo solo redirige, para que
  cualquier enlace ya compartido siga llegando al sitio correcto.
-->
<link rel="canonical" href="/registrar/">
<meta http-equiv="refresh" content="0; url=/registrar/">
<link rel="stylesheet" href="../assets/css/tokens.css">
<style>
  body{
    min-height:100dvh; display:grid; place-items:center;
    padding:var(--s6); text-align:center;

    font-family:'Aloe', system-ui, sans-serif;

    display:inline-flex; align-items:center; min-height:54px;
    padding:1rem 2rem; border-radius:8px;
    background:var(--black); color:var(--cream); text-decoration:none;
    font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; font-weight:bold;
  }

</style>

<body>
  <main>
    <p>Te estamos llevando al registro de comunidades.</p>
    <a href="/registrar/">Continuar</a>
  </main>

<!-- ══════════════════════════════════════════════════════════════
     Rutas internas al abrir el archivo con doble clic (file://).

     Servido por Cloudflare o por `npm run dev`, «/asistir/» es una
     ruta válida. Abriendo el archivo directamente, apunta a la raíz
     del disco y no existe: aquí se traduce a la carpeta vecina para
     poder ver las pantallas sin desplegar nada.

     No cambia nada cuando hay servidor: solo actúa con file://.
     ══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  if (window.location.protocol !== 'file:') return;
  var subir = '../';
  document.querySelectorAll('a[href^="/"]').forEach(function (a) {
    var r = a.getAttribute('href');
    if (r.indexOf('//') === 0) return;                 // enlaces de protocolo
    a.setAttribute('href', subir + r.replace(/^\//, '') +
      (/\/$/.test(r) ? 'index.html' : ''));
  });
})();
</script>

</body>
</html>
